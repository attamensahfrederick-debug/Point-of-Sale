<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Item</title>
    <style>
        :root {
            --bg: #f3f3f1;
            --panel: #ffffff;
            --panel-soft: #f7f7f6;
            --border: #e5e5e4;
            --text: #1f2926;
            --muted: #5d6964;
            --primary: #1d3b33;
            --success: #2c7a62;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 24px;
            min-height: 100vh;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            background: var(--panel);
            padding: 24px;
            border: 1px solid var(--border);
            border-radius: 10px;
        }

        h1 {
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font: inherit;
        }

        .btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 16px;
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .profit-card {
            background: #f0fdf4;
            border: 1px solid #86efac;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 16px;
            font-weight: 600;
        }

        .profit-card span {
            color: #033b19;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Add New Item</h1>

        <form>
            <div class="form-group">
                <label for="name">Item Name</label>
                <input type="text" id="name" placeholder="Enter item name" />
            </div>

            <div class="form-group">
                <label for="category">Category</label>
                <select id="category">
                    <option value="Electronics">Electronics</option>
                    <option value="Clothing">Clothing</option>
                    <option value="Groceries">Groceries</option>
                    <option value="Drinks">Drinks</option>
                </select>
            </div>

            <div class="form-group">
                <label for="stock">Stock Quantity</label>
                <input type="number" id="stock" value="0" />
            </div>

            <div class="form-group">
                <label for="costPrice">Cost Price</label>
                <input type="number" id="costPrice" placeholder="Enter cost price" />
            </div>

            <div class="form-group">
                <label for="sellingPrice">Selling Price</label>
                <input type="number" id="sellingPrice" placeholder="Enter selling price" />
            </div>

            <div class="profit-card" id="profitCard">
                Profit: <span id="profitValue">0.00</span>
            </div>

            <div class="form-group">
                <label for="notes">Notes</label>
                <textarea id="notes" rows="4" placeholder="Additional information"></textarea>
            </div>

            <button type="submit" class="btn">Save Item</button>
            <a href="Inventory.html" class="back-link">Back to Inventory</a>
        </form>
    </div>

    <script src="js/navigation.js"></script>
    <script src="js/additem.js"></script>
</body>
</html>
