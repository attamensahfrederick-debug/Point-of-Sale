<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | BiggFred Enterprise</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 32px 20px;
            font-family: "Trebuchet MS", Arial, sans-serif;
            background-color: #f7f8f5;
            background-image: radial-gradient(#d7dfd7 0.8px, transparent 0.8px);
            background-size: 22px 22px;
            color: #24312c;
        }

        .login-panel {
            width: min(100%, 440px);
            background: rgba(255, 255, 255, 0.94);
            border: 1px solid #dce5df;
            border-radius: 12px;
            box-shadow: 0 12px 28px rgba(45, 65, 56, 0.08);
            padding: 34px 28px 24px;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .brand-title {
            color: #203a32;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(32px, 5vw, 42px);
            font-weight: 700;
            margin-bottom: 6px;
        }

        .brand-subtitle {
            color: #61726a;
            font-size: 15px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            color: #203a32;
            font-size: 14px;
            font-weight: 700;
        }

        input {
            width: 100%;
            border: 1px solid #d4ddd7;
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 14px;
            color: #24312c;
            background: #fff;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
        }

        .helper-link {
            text-align: right;
            margin-top: -8px;
        }

        .helper-link a,
        .signup-link a {
            color: #3b82f6;
            text-decoration: none;
            font-size: 14px;
        }

        .helper-link a:hover,
        .signup-link a:hover,
        .helper-link a:focus-visible,
        .signup-link a:focus-visible {
            text-decoration: underline;
        }

        .sign-in-btn {
            width: 100%;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #203a32, #2d4f46);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            padding: 14px 18px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 10px 20px rgba(32, 58, 50, 0.18);
        }

        .sign-in-btn:hover,
        .sign-in-btn:focus-visible {
            transform: translateY(-1px);
            box-shadow: 0 12px 22px rgba(32, 58, 50, 0.2);
        }

        .signup-link {
            text-align: center;
            margin-top: 18px;
            color: #61726a;
            font-size: 15px;
        }

        .form-message {
            min-height: 20px;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 600;
            display: none;
        }

        .form-message.error {
            display: block;
            color: #b91c1c;
        }

        .form-message.success {
            display: block;
            color: #166534;
        }

        .sign-in-btn:disabled {
            opacity: 0.8;
            cursor: wait;
        }

        @media (max-width: 480px) {
            .login-panel {
                padding: 28px 20px 20px;
            }
        }
    </style>
</head>
<body>
    <main class="login-panel">
        <header class="brand-header">
            <h1 class="brand-title">Sign In</h1>
            <p class="brand-subtitle">BiggFred Enterprise</p>
        </header>

        <form class="login-form" id="loginForm">
            <div class="field-group">
                <label for="emailOrPhone">E-mail / Phone</label>
                <input type="text" id="emailOrPhone" name="email" placeholder="Enter e-mail / phone number">
            </div>

            <div class="field-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="********">
            </div>

            <div class="helper-link">
                <a href="#">Forgot your password?</a>
            </div>

            <button type="submit" class="sign-in-btn">Sign In</button>
        </form>

        <p class="signup-link">Don't have an account? <a href="#">Create one</a></p>
    </main>

    <script src="js/login.js"></script>
</body>
</html>
