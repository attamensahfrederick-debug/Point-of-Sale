<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debts and Credits</title>
</head>
<body>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #f0f9ff 0%, #f5f3ff 100%);
            color: #1f2937;
            padding: 40px 20px;
        }

        header-content {
            border: 10px;
            padding: 20px;
            border-spacing: 10px;
        }

        main {
            max-width: 960px;
            margin: 0 auto;
        }

        .header-content,
        .section-content {
            background: #ffffff;
            border: 1px solid #dbeafe;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 8px 24px rgba(30, 64, 175, 0.08);
        }

        .ledgers {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 24px;
        }

        h1,
        h2 {
            color: #1e3a8a;
            margin-bottom: 18px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
        }

        th,
        td {
            border-bottom: 1px solid #e5e7eb;
            padding: 14px 12px;
            text-align: left;
        }

        th {
            background: #eff6ff;
            color: #1e40af;
            font-size: 0.85rem;
            letter-spacing: 0.04em;
        }

        .creditor {
            color: #b45309;
            font-weight: 700;
        }

        .debtor {
            color: #047857;
            font-weight: 700;
        }

        .entry-form {
            display: grid;
            grid-template-columns: 1.2fr 1fr 1fr auto;
            gap: 12px;
            align-items: end;
        }

        label {
            display: grid;
            gap: 6px;
            color: #374151;
            font-size: 0.9rem;
            font-weight: 600;
        }

        input,
        select,
        button {
            min-height: 42px;
            border: 1px solid #bfdbfe;
            border-radius: 6px;
            padding: 0 12px;
            font: inherit;
        }

        button {
            border-color: #1d4ed8;
            background: #1d4ed8;
            color: #ffffff;
            cursor: pointer;
            font-weight: 700;
        }

        button:hover {
            background: #1e40af;
        }

        .summary {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            margin-top: 18px;
            color: #374151;
            font-weight: 700;
        }

        .summary span {
            color: #1d4ed8;
        }

        @media (max-width: 700px) {
            body {
                padding: 20px 12px;
            }

            .entry-form {
                grid-template-columns: 1fr;
            }

            .ledgers {
                grid-template-columns: 1fr;
            }

            table {
                font-size: 0.9rem;
            }

            th,
            td {
                padding: 11px 8px;
            }
        }
    </style>
<body>
<main>
    <div class="section-content">
        <h2>ADD DEBT OR CREDIT</h2>
        <form class="entry-form" id="entry-form">
            <label>
                Name
                <input id="person" type="text" placeholder="Customer or supplier" required>
            </label>
            <label>
                Amount (Ghc)
                <input id="amount" type="number" min="0" step="0.01" placeholder="0.00" required>
            </label>
            <label>
                Type
                <select id="entry-type">
                    <option value="creditor">Creditor</option>
                    <option value="debtor">Debtor</option>
                </select>
            </label>
            <button type="submit">Add entry</button>
        </form>
    </div>

    <h1>CREDITORS AND DEBTORS</h1>
    <div class="ledgers">
        <div class="header-content">
            <h2>CREDITORS</h2>
            <table>
                <thead>
                    <tr>
                        <th>NAME</th>
                        <th>AMOUNT</th>
                    </tr>
                </thead>
                <tbody id="creditors-body">
                    <tr>
                        <td>J and S enterprise</td>
                        <td>Ghc 3000.00</td>
                    </tr>
                </tbody>
            </table>
            <div class="summary">Total: <span id="creditor-total">Ghc 3,000.00</span></div>
        </div>

        <div class="section-content">
            <h2>DEBTORS</h2>
            <table>
                <thead>
                    <tr>
                        <th>NAME</th>
                        <th>AMOUNT</th>
                    </tr>
                </thead>
                <tbody id="debtors-body">
                    <tr>
                        <td>Sameul Opoku Ent</td>
                        <td>Ghc 4000.00</td>
                    </tr>
                </tbody>
            </table>
            <div class="summary">Total: <span id="debtor-total">Ghc 4000.00</span></div>
        </div>
    </div>
</main>
<script src="js/debts_credits.js"></script>
</body>
</html>
