<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accounts | BiggFred Enterprise</title>
</head>
<body>
    <style>
        :root {
            --bg: #eef2f0;
            --panel: #ffffff;
            --panel-soft: #f5f7f6;
            --border: #dfe6e1;
            --text: #1a2421;
            --muted: #586762;
            --primary: #1f3d36;
            --primary-soft: #edf4f2;
            --success: #2b6a53;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 64px 20px;
        }

        .header-section {
            max-width: 860px;
            margin: 0 auto 28px;
            text-align: center;
        }

        .header-content {
            color: var(--text);
            font-size: clamp(30px, 5vw, 46px);
            font-weight: 700;
            margin-bottom: 10px;
        }

        .header-subtitle {
            color: var(--muted);
            font-size: 15px;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
            max-width: 860px;
            margin: 0 auto;
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            min-height: 220px;
            padding: 24px;
            position: relative;
        }

        .card.selected {
            border-color: var(--primary);
            background: var(--primary-soft);
        }

        .card[data-color="manager"] { --accent-color: var(--primary); }
        .card[data-color="sales attendant"] { --accent-color: var(--success); }

        .card-title {
            color: var(--text);
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .card-text {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 22px;
        }

        .card-button {
            align-self: flex-start;
            margin-top: auto;
            border: 1px solid var(--accent-color);
            background: var(--accent-color);
            color: #fff;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
        }

        .card-button:hover,
        .card-button:focus-visible {
            opacity: 0.92;
        }

        .account-status {
            color: var(--muted);
            font-size: 13px;
            font-weight: 600;
            margin: -8px auto 26px;
            max-width: 860px;
            text-align: center;
        }

        @media (max-width: 640px) {
            body { padding: 40px 16px; }
            .card-grid { grid-template-columns: 1fr; }
            .card { min-height: 0; padding: 22px; }
        }
    </style>
    <main>
    <div class="header-section">
        <h1 class="header-content">Accounts</h1>
        <p class="header-subtitle">Manager and Sales attendant accounts</p>
    </div>

    <div class="card-grid">
        <article class="card" data-color="manager" data-page="manager.html">
            <h2 class="card-title">Manager Account</h2>
            <p class="card-text">Access business data, services, and management tools from one place.</p>
        </article>

        <article class="card" data-color="sales attendant" data-page="salesperson.html">
            <h2 class="card-title">Sales Attendant</h2>
            <p class="card-text">Handle daily sales activity and keep customer transactions moving.</p>
        </article>
    </div>
    
    </main>
    <script src="js/navigation.js"></script>
    <script src="js/accounts.js"></script>
</body>
</html>
